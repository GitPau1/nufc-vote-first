<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>승부예측 프로토타입</title>
<style>
  /* ============ 실제 디자인 시스템 토큰 (vault/99_old/specs/11-design-system.md 그대로) ============
     이 프로토타입은 개발 코드베이스(frontend/)와 완전히 분리되어 있다 — 여기서 디자인을 확정한 뒤
     실제 개발 단계에서 React 컴포넌트로 옮긴다. 다크 모드는 실제 앱도 아직 지원하지 않아(MVP 이후)
     여기서도 라이트 모드만 다룬다 — 누락이 아니라 실제 앱과 맞춘 의도된 선택. */
  :root {
    --c-primary: #41b6e6;
    --c-primary-dim: rgba(65,182,230,0.12);
    --c-primary-dark: #1a9fd4;
    --c-black: #111111;
    --c-gray-1: #333333;
    --c-gray-2: #666666;
    --c-gray-3: #a8a8a8;
    --c-gray-4: #e1e7ef;
    --c-disabled: #ebebeb;
    --c-bg: #fafafa;
    --c-surface: #ffffff;
    --c-positive: #2e9e4f;
    --c-positive-dim: #e6f4ea;
    --c-negative: #d93025;
    --c-negative-dim: #fce8e6;
    /* 시스템에 없는 색 — "보통" 평점 표시용으로 이번에 임의 추가(사용자 확인, 2026-08-20) */
    --c-warning: #c8801f;
    --c-warning-dim: #fbf1e4;

    --r-xs: 8px; --r-sm: 10px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px;
    --sh-w100: 0px 0px 2px rgba(0,0,0,.07), 0px 1px 2px rgba(0,0,0,.07);
    --sh-g200: 0px 1px 4px rgba(0,0,0,.06);
    --sh-w200: 0px 1px 6px rgba(0,0,0,.12);
    --sh-w300: 0px 1px 20px rgba(0,0,0,.07);
    --shell-w: 480px;
    --content-w: 1140px;

    --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(560px 320px at 12% 0%, rgba(65,182,230,.10), transparent 70%),
      radial-gradient(480px 300px at 100% 8%, rgba(65,182,230,.07), transparent 70%),
      var(--c-bg);
    background-attachment: fixed;
    color: var(--c-black);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button { font-family: inherit; }
  img { display: block; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  @keyframes rise-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    35% { transform: scale(1.14); }
    100% { transform: scale(1); }
  }
  @keyframes check-in {
    from { transform: scale(0) rotate(-15deg); opacity: 0; }
    to   { transform: scale(1) rotate(0); opacity: 1; }
  }

  /* ---- 타이포 스케일 ---- */
  .t-title-2 { font-size: 28px; line-height: 38px; letter-spacing: -0.0236em; font-weight: 900; }
  .t-title-3 { font-size: 24px; line-height: 32px; letter-spacing: -0.023em; font-weight: 900; }
  .t-heading-1 { font-size: 22px; line-height: 30px; letter-spacing: -0.0194em; font-weight: 800; }
  .t-headline-1 { font-size: 18px; line-height: 26px; letter-spacing: -0.002em; font-weight: 800; }
  .t-body-1 { font-size: 16px; line-height: 24px; letter-spacing: 0.0057em; }
  .t-body-2 { font-size: 15px; line-height: 22px; letter-spacing: 0.0096em; font-weight: 700; }
  .t-label-1 { font-size: 14px; line-height: 20px; letter-spacing: 0.0145em; }
  .t-label-2 { font-size: 13px; line-height: 18px; letter-spacing: 0.0194em; }
  .t-caption-1 { font-size: 12px; line-height: 16px; letter-spacing: 0.0252em; }
  .t-caption-2 { font-size: 11px; line-height: 14px; letter-spacing: 0.0311em; }
  .muted { color: var(--c-gray-2); }
  .faint { color: var(--c-gray-3); }

  /* ---- 헤더: 모바일(중앙 로고/뒤로가기) vs 데스크탑(GNB) — 실제 AppHeader 구조 그대로 ---- */
  .app-header {
    position: sticky; top: 0; z-index: 50; width: 100%;
    background: linear-gradient(to bottom, #fff, rgba(255,255,255,.75));
    backdrop-filter: blur(6px);
  }
  .app-header-inner { max-width: 1140px; margin: 0 auto; height: 62px; display: flex; align-items: center; position: relative; padding: 0 16px; }
  .app-header-mobile { display: flex; width: 100%; align-items: center; justify-content: center; }
  .app-header-desktop { display: none; width: 100%; align-items: center; }
  .app-header-back {
    position: absolute; left: 16px; display: flex; align-items: center; gap: 6px;
    background: none; border: none; color: var(--c-gray-2); font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .app-logo { font-size: 24px; font-weight: 900; letter-spacing: -0.02em; color: var(--c-black); text-decoration: none; }
  .desktop-nav { display: flex; gap: 40px; margin-left: 56px; }
  .desktop-nav a {
    height: 62px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700;
    color: var(--c-gray-2); text-decoration: none; border-bottom: 2px solid transparent;
  }
  .desktop-nav a.active { color: var(--c-primary); border-bottom-color: var(--c-primary); }
  .login-pill {
    margin-left: auto; border: 1px solid var(--c-gray-4); border-radius: var(--r-pill);
    padding: 7px 16px; font-size: 13px; font-weight: 700; color: var(--c-black); background: none;
  }
  @media (min-width: 640px) {
    .app-header-mobile { display: none; }
    .app-header-desktop { display: flex; }
  }


  /* ---- 공용 컴포넌트 ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 44px; padding: 0 16px; border-radius: var(--r-sm); font-size: 15px; font-weight: 700;
    border: none; cursor: pointer; transition: opacity .15s ease, transform .15s ease;
  }
  .btn:hover { opacity: .82; } .btn:active { opacity: .6; transform: scale(.97); }
  .btn:disabled { background: var(--c-disabled) !important; color: var(--c-gray-3) !important; opacity: 1; transform: none; cursor: not-allowed; }
  .btn-lg { height: 48px; }
  .btn-primary { background: var(--c-primary); color: #fff; }
  .btn-outline { background: transparent; border: 1px solid var(--c-gray-4); color: var(--c-black); }
  .btn-secondary { background: var(--c-disabled); color: var(--c-black); }
  .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: var(--r-pill); }
  .btn-full { width: 100%; }
  .num-bump { display: inline-block; animation: pop .28s ease; }

  .badge {
    display: inline-flex; align-items: center; border-radius: var(--r-pill);
    padding: 3px 9px; font-size: 11px; font-weight: 700;
  }
  .badge-default { background: var(--c-primary-dim); color: var(--c-primary-dark); }
  .badge-positive { background: var(--c-positive-dim); color: var(--c-positive); }
  .badge-negative { background: var(--c-negative-dim); color: var(--c-negative); }
  .badge-warning { background: var(--c-warning-dim); color: var(--c-warning); }
  .badge-outline { background: var(--c-disabled); color: var(--c-gray-2); }

  .card { background: var(--c-surface); border: 1px solid var(--c-gray-4); border-radius: var(--r-lg); }

  .progress-track { height: 8px; width: 100%; border-radius: var(--r-pill); background: var(--c-disabled); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--c-primary); transition: width .25s ease; }

  /* ---- 스텝 인디케이터 (원형 노드 + 커넥터, 상태를 텍스트가 아니라 모양으로만 표현) ---- */
  .step-circle { position: relative; width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .step-circle.done { background: var(--c-primary); color: #fff; font-size: 11px; font-weight: 900; }
  .step-circle.active { background: #fff; border: 2px solid var(--c-primary); }
  .step-circle.active .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-primary); }
  .step-circle.pending { background: #fff; border: 2px solid var(--c-gray-4); }

  /* 모바일 상단 스텝 트랙 — 원형 노드+커넥터만, 라벨은 아래 .step-hero로 분리했다. 화면 전체 폭 대신
     75%만 차지하게 해서 카드 폭과 시각적으로 맞춘다. */
  .step-track-h { display: flex; align-items: center; width: 50%; margin: 0; }
  .step-connector-h { flex: 1; height: 2px; margin: 0 6px; background: var(--c-gray-4); }
  .step-connector-h.filled { background: var(--c-primary); }
  /* 현재 활성화된 단계의 타이틀/설명 — 스텝 트랙 바로 아래, 왼쪽 정렬(데스크탑 사이드바와 동일 위계) */
  .step-hero { margin-top: 20px; text-align: left; }

  .step-track-v { display: flex; flex-direction: column; }
  .step-node-v { display: flex; align-items: flex-start; gap: 12px; }
  .step-node-v .name { font-size: 14px; font-weight: 700; color: var(--c-black); line-height: 20px; }
  .step-node-v .name.pending-text { color: var(--c-gray-3); }
  /* 활성화된 단계에서만 타이틀 아래에 붙는 설명 — 다른 단계(완료/대기)엔 렌더되지 않는다 */
  .step-node-v-desc { margin: 4px 0 0; font-size: 12px; line-height: 17px; color: var(--c-gray-2); max-width: 168px; }
  .step-connector-v { width: 2px; height: 24px; margin: 2px 0 2px 9px; background: var(--c-gray-4); }
  .step-connector-v.filled { background: var(--c-primary); }

  /* ---- 경기 예측 화면 전용 레이아웃 ---- */
  .view-mobile { display: block; }
  .view-desktop { display: none; }
  @media (min-width: 640px) {
    .view-mobile { display: none; }
    .view-desktop { display: block; }
  }
  .match-screen { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
  @media (min-width: 640px) {
    .match-screen { max-width: var(--content-w, 1140px); padding: 24px 40px 60px; }
  }
  .desktop-back {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 28px; background: none; border: none;
    color: var(--c-gray-2); font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .match-screen-grid { display: grid; grid-template-columns: 200px 1fr; column-gap: 40px; align-items: stretch; }
  /* 목록 화면 데스크탑 전용 — 왼쪽 경기 리스트(2) : 오른쪽 전체 랭킹(1) */
  .list-screen-grid { display: grid; grid-template-columns: 2fr 1fr; column-gap: 40px; align-items: start; }

  /* 메타 정보 + 스코어 스테퍼를 한 덩어리로 묶는 흰 카드 — 스텝 인디케이터와 시각적으로 분리하는 역할 */
  .match-card { background: var(--c-surface); border: 1px solid var(--c-gray-4); border-radius: var(--r-lg); padding: 20px 16px; }

  .match-meta { text-align: center; }
  .match-meta .league { font-size: 13px; font-weight: 800; color: var(--c-gray-2); margin: 0 0 4px; }
  .match-meta .datetime { font-size: 13px; color: var(--c-gray-3); margin: 0; }

  .score-widget { display: flex; align-items: center; justify-content: center; gap: 20px; }
  .score-widget .team-label { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 88px; }
  .score-widget .team-label span { font-size: 14px; font-weight: 800; text-align: center; }
  .score-stepper-card { width: 64px; border-radius: var(--r-md); border: 1px solid var(--c-gray-4); overflow: hidden; background: var(--c-surface); }
  .score-stepper-card button {
    width: 100%; height: 34px; border: none; background: var(--c-primary); color: #fff;
    font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background-color .15s ease;
  }
  @media (hover: hover) { .score-stepper-card button:hover { background: var(--c-primary-dark); } }
  .score-stepper-card button:disabled { background: var(--c-surface); color: var(--c-gray-3); cursor: not-allowed; }
  @media (hover: hover) { .score-stepper-card button:disabled:hover { background: var(--c-surface); } }
  .score-stepper-card .value-cell {
    height: 52px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900;
    border-top: 1px solid var(--c-gray-4); border-bottom: 1px solid var(--c-gray-4);
  }

  /* .avatar = 선수 사진(원형, 64px 고정). 구단 로고는 자르지 않는 .team-logo로 별도 처리. */
  .avatar { width: 64px; height: 64px; border-radius: var(--r-pill); background: var(--c-disabled); object-fit: cover; flex-shrink: 0; }
  .team-logo { width: 48px; height: auto; object-fit: contain; flex-shrink: 0; }

  /* ---- 페이지 레이아웃 ---- */
  .page { max-width: var(--shell-w); margin: 0 auto; padding: 16px 16px 40px; }
  .page-detail { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
  @media (min-width: 640px) {
    .page { padding-bottom: 40px; }
    .page-detail { padding-bottom: 40px; }
  }

  .sticky-bar {
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: var(--shell-w);
    padding: 16px; background: rgba(255,255,255,.95); backdrop-filter: blur(6px); border-top: 1px solid var(--c-gray-4); z-index: 30;
  }
  @media (min-width: 640px) {
    .sticky-bar { position: static; transform: none; max-width: 560px; margin: 24px auto 0; background: none; border-top: none; backdrop-filter: none; padding: 0; }
  }

  /* ---- 목록 화면: 월 표시(좌, 연도 없이 강조) + 이전/다음 달 화살표(우) ---- */
  .month-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .month-bar-label { font-size: 24px; font-weight: 900; letter-spacing: -0.02em; color: var(--c-black); }
  .month-bar-nav { display: flex; gap: 2px; }
  .day-strip-arrow {
    width: 32px; height: 32px; border-radius: var(--r-pill); border: 1px solid var(--c-gray-4); background: var(--c-surface);
    color: var(--c-gray-2); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  @media (hover: hover) { .day-strip-arrow:hover { border-color: var(--c-primary); color: var(--c-primary); } }

  /* 주차 섹션: 라벨 + 그 아래 리스트 박스(카드 아님, divider로 행을 나눔) */
  .week-sections { display: flex; flex-direction: column; gap: 24px; }
  .week-section-label {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; padding: 0 2px;
    font-size: 15px; font-weight: 800; color: var(--c-black);
  }
  .week-box { border-radius: var(--r-lg); border: 1px solid var(--c-gray-4); background: var(--c-surface); overflow: hidden; }

  .week-empty { padding: 20px 16px; text-align: center; font-size: 13px; color: var(--c-gray-3); }

  .week-row {
    width: 100%; display: block; padding: 14px; background: none; border: none; border-bottom: 1px solid var(--c-gray-4);
    text-align: left; cursor: pointer; animation: rise-in .38s ease both; transition: background-color .15s ease;
  }
  .week-row:last-child { border-bottom: none; }
  /* 비활성(미참여/예정)은 옵션을 흐리는 대신 컨테이너 배경 자체를 톤다운해서 "막힌" 느낌을 준다 */
  .week-row:disabled { cursor: not-allowed; background: var(--c-bg); }
  .week-row:not(:disabled):active { background: var(--c-disabled); }
  @media (hover: hover) {
    .week-row:not(:disabled):hover { background: var(--c-primary-dim); }
  }
  /* 상단은 경기 정보만(칩 없음) — 칩은 하단으로 이동해 좌우 중복을 없앤다. */
  .week-row-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .week-row-round { font-size: 12px; color: var(--c-gray-3); font-weight: 700; }
  .match-teams { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 6px 0; }
  .match-teams .side { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 84px; }
  .match-teams .side span { font-size: 13px; font-weight: 700; text-align: center; line-height: 1.25; }
  .match-teams .mid { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; }
  /* 완료된 경기는 결과 위, 예정/진행중 경기는 시간 위에 날짜를 작게 표시 */
  .match-teams .mid .mid-date { font-size: 11px; color: var(--c-gray-3); font-weight: 700; }
  .match-teams .mid .score { font-size: 22px; font-weight: 900; }
  .match-teams .mid .kickoff { font-size: 15px; font-weight: 800; }
  /* 하단: 좌측 칩(상태), 우측은 상태별 요약(참여/진행중/예정) — 미참여는 우측 비움 */
  .week-row-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--c-gray-4); }
  .week-row-meta .badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .week-row-action { display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 700; color: var(--c-primary); }
  .week-row-action.locked { font-size: 16px; line-height: 1; color: var(--c-gray-3); }
  .week-row-result { text-align: right; }

  /* ---- 결과 화면: 내 예측 / 전체 결과 토글(모바일 전용, 데스크탑은 좌우 컬럼으로 대체) ---- */
  .segment-bar { display: flex; gap: 2px; background: var(--c-disabled); border-radius: var(--r-pill); padding: 3px; margin-bottom: 20px; }
  .segment {
    flex: 1; padding: 9px 4px; border-radius: var(--r-pill); border: none; background: none; cursor: pointer;
    font-size: 13px; font-weight: 700; color: var(--c-gray-2); transition: background-color .2s ease, color .2s ease;
  }
  .segment.active { background: var(--c-primary); color: #fff; }
  @media (min-width: 640px) { .segment-bar { display: none; } }

  /* ---- 이 주차 랭킹 리스트 ---- */
  /* 레퍼런스(주간 스코어 리더보드) 구조: 큰 순위 숫자 + 원형 아바타 + 이름 + 우측 강조된 점수 셀 */
  /* 이 주차 랭킹 — 전체 인원 스크롤 리스트 + 헤더 행. 종합 점수만 굵게 강조, 나머진 텍스트만(배경색 없음). */
  .rank-list-scroll { max-height: 440px; overflow-y: auto; }
  /* 결과 페이지 "이 주차 랭킹" 전용 — 목록 화면 사이드바의 .rank-list-scroll과는 자르는 방식이 달라 분리했다.
     데스크탑은 JS에서 10명으로 잘라 자연 높이로 보여주고(스크롤 없음), 모바일은 전체 로우를 다 그린 뒤
     여기 mobile-capped로 기기 화면 높이(vh)만큼만 노출 + 하단 페이드로 "더 있음"을 암시한다. */
  .week-rank-list.mobile-capped { max-height: 46vh; overflow: hidden; position: relative; }
  .week-rank-list.mobile-capped::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 40px;

  .rank-row-truncated { text-align: center; padding: 4px 4px 8px; color: var(--c-gray-3); font-size: 13px; letter-spacing: .2em; }

    color: var(--c-gray-2); font-size: 13px; font-weight: 700; cursor: pointer;

  .rank-header-row .rank-cell, .rank-header-row .rank-col {
    font-size: 11px; font-weight: 700; color: var(--c-gray-3);
  }
  .rank-row { display: flex; align-items: center; gap: 8px; padding: 10px 4px; border-bottom: 1px solid var(--c-gray-4); }
  .rank-row:last-child { border-bottom: none; }
  .rank-row.me { background: var(--c-primary-dim); border-radius: var(--r-md); padding: 10px 8px; border-bottom: none; }
  .rank-cell { width: 32px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
  .rank-number-big { font-size: 16px; font-weight: 900; color: var(--c-black); }
  .rank-row.me .rank-number-big { color: var(--c-primary-dark); }
  .rank-delta { font-size: 10px; font-weight: 700; }
  .rank-delta.up { color: var(--c-negative); }
  .rank-delta.down { color: var(--c-gray-3); }
  .rank-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--c-disabled); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--c-gray-3); overflow: hidden; }
  .rank-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: var(--c-black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-col { width: 42px; flex-shrink: 0; text-align: center; font-size: 15px; color: var(--c-gray-3); font-weight: 600; }
  /* 종합은 폰트 크기는 다른 점수와 동일, 색상만 primary로 구분(굵기는 유지) */
  .rank-col.total { width: 48px; font-weight: 900; color: var(--c-primary-dark); }
  .rank-row.me .rank-col.total { color: var(--c-primary); }

  .player-row {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; border: 1px solid var(--c-gray-4); border-radius: var(--r-md); background: var(--c-surface);
    cursor: pointer; text-align: left;
    transition: border-color .15s ease, background-color .15s ease, transform .15s ease;
  }
  .player-row.selected { border-color: var(--c-primary); background: var(--c-primary-dim); }
  .player-row .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .player-row .squad-number { width: 20px; flex-shrink: 0; text-align: center; font-size: 13px; font-weight: 800; color: var(--c-gray-3); }
  .player-row .name-block { min-width: 0; }
  .player-row .name-block .name { font-size: 15px; font-weight: 700; color: var(--c-black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-row .name-block .sub { font-size: 12px; color: var(--c-gray-3); margin-top: 1px; }
  /* ---- "내 선수 픽" 모바일 전용 세로 목록 — 결과·제출완료 화면 둘 다 사용. 375px에서 가로 카드 3장이
     좁아지는 대신, 포지션을 행 맨 위 단독 줄로 두고 그 아래 [사진·이름(+평점)]과 [배당·점수]를
     한 줄에서 가운데 정렬로 나란히 놓는다. 배당은 caption 크기로 작게, 점수는 굵고 크게 강조.
     데스크탑은 기존 position-row 카드 그대로 유지. ---- */
  .pick-result-list { border: 1px solid var(--c-gray-4); border-radius: var(--r-lg); overflow: hidden; }
  .pick-result-row { padding: 12px; border-bottom: 1px solid var(--c-gray-4); background: var(--c-surface); }
  .pick-result-row:last-child { border-bottom: none; }
  .pick-result-row .pick-position { margin: 0 0 8px; font-size: 11px; font-weight: 700; color: var(--c-gray-3); }
  .pick-result-row .pick-result-main { display: flex; align-items: center; gap: 10px; }
  .pick-result-row .pick-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--c-disabled); }
  .pick-result-row .pick-info { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .pick-result-row .pick-info .name { margin: 0; font-size: 14px; font-weight: 800; color: var(--c-black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick-result-row .pick-value { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .pick-result-row .pick-value .odds { font-size: 11px; color: var(--c-gray-3); font-weight: 700; }
  .pick-result-row .pick-value .points { font-size: 17px; font-weight: 900; color: var(--c-primary-dark); }

  /* ---- 선수 픽: 포지션 3개 가로 카드 (레퍼런스 구조: 라벨 → divider → 이름/숫자 + 사진 블리드) ---- */
  .position-row { display: flex; gap: 10px; }
  .position-card {
    flex: 1; min-width: 0; position: relative; text-align: left; cursor: pointer;
    border: 1px solid var(--c-gray-4); border-radius: var(--r-lg); background: var(--c-bg);
    padding: 12px; min-height: 196px; display: flex; flex-direction: column;
    transition: border-color .15s ease, transform .15s ease;
  }
  .position-card.filled { background: var(--c-surface); }
  @media (hover: hover) { .position-card:hover { border-color: var(--c-primary); transform: translateY(-2px); } }
  .position-card-label { font-size: 12px; font-weight: 800; color: var(--c-gray-2); }
  .position-card-divider { height: 1px; background: var(--c-gray-4); margin: 8px 0 10px; }
  .position-card-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .position-card-empty span { font-size: 11px; font-weight: 700; color: var(--c-gray-3); text-align: center; }
  .silhouette-circle {
    width: 40px; height: 40px; border-radius: 50%; background: var(--c-disabled);
    display: flex; align-items: center; justify-content: center; color: var(--c-gray-3);
  }
  /* 마스크로 왼쪽을 페이드아웃시켜 "블리드"되게 하려던 처리를 없애고, 빈 상태(실루엣)와 동일한
     레이아웃(사진 중앙 → 이름 → 배당)의 깨끗한 원형 사진으로 통일했다. */
  .position-card-filled { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .position-card-filled .player-photo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
  .position-card-filled .last-name { font-size: 13px; font-weight: 800; margin: 2px 0 0; text-align: center; }
  .position-card-filled .rating-num { font-size: 12px; font-weight: 700; color: var(--c-primary-dark); }
  .position-card-filled .result-pick-divider { align-self: stretch; height: 1px; background: var(--c-gray-4); margin: 2px 0; }

  /* ---- 선수 선택 모달: 모바일 바텀시트 / 데스크탑 중앙 다이얼로그 ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60;
    display: flex; align-items: flex-end; justify-content: center;
    animation: fade-in .2s ease;
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .modal-sheet {
    width: 100%; max-width: var(--shell-w); max-height: 78vh; overflow-y: auto; position: relative;
    background: var(--c-surface); border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 20px 16px;
    animation: sheet-up .25s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  /* 드래그 핸들은 상단 padding 영역 안에 절대 위치로 띄워서, 타이틀-상단 거리와 목록-하단 거리가
     똑같이 padding 값(20px)만으로 결정되게 한다(핸들이 별도 여백을 더 먹지 않음). */
  .modal-drag-handle { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 40px; height: 5px; border-radius: var(--r-pill); background: var(--c-gray-4); }
  .player-list { display: flex; flex-direction: column; gap: 8px; }
  @media (min-width: 640px) {
    .modal-overlay { align-items: center; }
    .modal-sheet { max-width: 420px; max-height: 80vh; border-radius: var(--r-lg); animation: dialog-in .18s ease; }
    .modal-drag-handle { display: none; }
    @keyframes dialog-in { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
  }
  .modal-title { font-size: 17px; font-weight: 800; margin: 0 0 12px; }

  /* ---- 확인 화면: 경기 예측 + 선수 픽을 한 match-card 안에 섹션으로 ---- */
  .confirm-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .edit-link { background: none; border: none; color: var(--c-primary); font-weight: 700; font-size: 13px; cursor: pointer; padding: 0; }

  @media (hover: hover) {
    .player-row:not(.selected):hover { border-color: var(--c-gray-3); transform: translateY(-1px); }
  }

  /* ---- 매치업 카드 ---- */
  /* 좌우 padding은 부모(predict-compare-box/match-card)가 이미 갖고 있어 중복이었다 — 375px 모바일에서
     가운데 "내 예측" 칸이 20px대로 짜부라져 한글이 세로로 쪼개지던 원인. gap도 모바일에서 좁혀 여유를 만든다. */
  .matchup-card { margin: 0; border-radius: var(--r-lg); padding: 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
  @media (min-width: 640px) { .matchup-card { gap: 24px; } }
  /* 칩+예측 스코어+실제 결과를 하나의 컨테이너로 묶는다 — 계층은 divider가 아니라 글자 크기로만 구분.
     fafafa 배경은 전체가 아니라 "실제 결과"에만(.actual-result-box) — 칩/매치업 카드는 배경 없는 채로
     match-card의 흰 배경 위에 얹힌다. 좌우 마진은 이 박스의 padding(16px)으로 그대로 고정. */
  .predict-compare-box { padding: 20px 16px 16px; text-align: center; }
  .actual-result-box { background: var(--c-bg); border-radius: var(--r-md); padding: 12px 16px; margin-top: 24px; }
  /* 히어로 — 경기 예측/선수 픽 카드와 별개 컨테이너. 다크 배경이라 내부 텍스트 컬러를 흰색 계열로 오버라이드. */
  .result-hero-box { background: #111011; border-radius: var(--r-lg); padding: 20px 16px; text-align: center; margin-bottom: 16px; }
  .result-hero-box p, .result-hero-box span { color: #fff; }
  .result-hero-box .muted { color: rgba(255,255,255,0.55); }
  .result-hero-stats { display: flex; justify-content: center; gap: 20px; margin-top: 16px; background: rgba(255,255,255,0.06); border-radius: var(--r-md); padding: 14px 16px; }
  .result-hero-stats > div { flex: 1; min-width: 0; }

  /* ---- 결과 발표 카운트다운 — 기존 club-status-card처럼 예외적으로 다크(네이비) 배경 사용 ---- */
  .countdown-block { background: #0c2340; border-radius: var(--r-lg); padding: 20px 16px 18px; text-align: center; }
  .countdown-caption { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.65); margin: 0 0 10px; }
  .countdown-timer { display: flex; align-items: flex-start; justify-content: center; gap: 10px; }
  .countdown-seg { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 34px; }
  .countdown-seg .num { font-size: 26px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
  .countdown-seg .unit { font-size: 10px; color: rgba(255,255,255,.5); }
  .countdown-colon { font-size: 22px; font-weight: 900; color: rgba(255,255,255,.3); margin-top: 1px; }
  .matchup-card .team { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 88px; flex-shrink: 0; }
  .matchup-card .team span { font-size: 13px; font-weight: 700; color: var(--c-gray-2); }
  .matchup-card .score { font-size: 28px; font-weight: 900; }

  .result-card { background: var(--c-primary-dim); border-radius: var(--r-lg); padding: 16px; }
  .result-card .row { text-align: center; }
  .result-card .divider { height: 1px; background: var(--c-gray-4); margin: 12px 0; }
  .result-card .bottom-row { display: flex; align-items: center; justify-content: space-between; }

  .pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pick-tile { text-align: center; padding: 10px 6px; }
  .pick-tile img { margin: 0 auto 6px; }

  .total-bar { display: flex; align-items: center; justify-content: space-between; background: var(--c-primary); color: #fff; border-radius: var(--r-lg); padding: 14px 16px; margin-top: 16px; }

  .proto-note {
    margin-top: 24px; text-align: center; padding: 10px; border: 1px dashed var(--c-gray-3);
    border-radius: var(--r-md); font-size: 12px; color: var(--c-gray-3); background: none; width: 100%; cursor: pointer;
  }
</style>

// 이 경기에 "이미 확정되어 데이터에 박혀있는 예측"이 있는지 — 이번 세션에 편집 중인 state.scores/picks는
// 포함하지 않는다(그건 아직 제출 전이라 언제든 바뀔 수 있는 값이라서). 예측/픽/확인 단계에서 "아직 편집
// 가능한(actionable) 경기"를 걸러낼 때는 반드시 이 함수를 써야 한다 — myPredictionFor를 쓰면 지금
// 편집 중인 경기까지 "이미 제출함"으로 착각해서 편집 화면에서 빠져버리는 버그가 난다.
function hasCommittedPrediction(m) {
  return !!m.myPrediction || !!m.myResult;
}

// 한 경기에 대해 "내가 이미 제출한 예측"을 화면에 보여줄 때 어디서 값을 가져와야 하는지 한 곳에서
// 정리한다(표시 전용 — actionable 판정에는 hasCommittedPrediction을 쓸 것).
// 우선순위: 이번 세션에 방금 입력 중인 것(state.scores/picks) → 이미 제출했지만 아직 안 끝난 경기(m.myPrediction)
// → 끝나서 결과까지 나온 경기(m.myResult) → 아무것도 없으면 null(=마감됐고 참여도 안 함, 혹은 아직 미제출).
// "참여" 배지는 m.myPrediction과 m.myResult 둘 다 커버해야 한다 — 이미 제출했으면 경기가 아직 안
// 끝났어도 "참여"지 "진행중(미제출)"이 아니다(사용자 확인, 2026-08-23).
function myPredictionFor(m) {
  if (state.scores[m.id]) return { predicted: state.scores[m.id], picks: POSITIONS.map(p => state.picks[m.id]?.[p]) };
  if (m.myPrediction) return m.myPrediction;
  if (m.myResult) return m.myResult;
  return null;
}

function ratingTier(r) { return r >= 7 ? 'good' : r >= 6 ? 'mid' : 'bad'; }
function ratingBadgeClass(tier) { return tier === 'good' ? 'badge-positive' : tier === 'bad' ? 'badge-negative' : 'badge-warning'; }
function demoPoints(player) { return ratingTier(player.rating) === 'good' ? Math.round(player.multiplier * 2.4) : 0; }
function matchPoints(predicted, actual) {
  const outcome = ([a,b]) => a > b ? 'W' : a < b ? 'L' : 'D';
  if (predicted[0] === actual[0] && predicted[1] === actual[1]) return 3;
  return outcome(predicted) === outcome(actual) ? 2 : 0;
}

// 이 주차 랭킹 더미 데이터 — 전체 인원(myResult.total) 전부 생성해서 스크롤로 다 보이게 한다.
// Math.random() 대신 rank로 시드를 고정한 의사난수를 써서, 리렌더될 때마다 숫자가 바뀌지 않게 한다.
const LEADERBOARD_NAME_POOL = [
  '김민준', '이서연', '정하윤', '박지훈', '최유진', '강태양', '윤소율', '임도현',
  '한지민', '오세훈', '서지우', '신유나', '조민재', '배수아', '권도윤', '황리안',
];
function pseudoRandom01(seed) {
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}
const MATCH_POINT_CHOICES = [0, 2, 3];

function buildLeaderboard(myResult) {
  const total = myResult.total;
  const myRank = myResult.rank;
  const topTotal = 15;
  const entries = [];

  for (let rank = 1; rank <= total; rank++) {
    const isMe = rank === myRank;
    let totalPts, matchPts, pickPts;

    if (isMe) {
      totalPts = myResult.totalPoints;
      matchPts = myResult.matchPoints;
      pickPts = totalPts - matchPts;
    } else {
      // rank1(15점) -> 내 등수(내 점수) -> 마지막 등수(0점)로 이어지는 2단 보간 곡선
      if (rank < myRank) {
        const t = (rank - 1) / Math.max(1, myRank - 1);
        totalPts = Math.round(topTotal - t * (topTotal - myResult.totalPoints));
      } else {
        const t = (rank - myRank) / Math.max(1, total - myRank);
        totalPts = Math.round(myResult.totalPoints - t * myResult.totalPoints);
      }
      matchPts = MATCH_POINT_CHOICES[Math.floor(pseudoRandom01(rank) * MATCH_POINT_CHOICES.length)];
      if (matchPts > totalPts) matchPts = totalPts;
      pickPts = totalPts - matchPts;
    }

    const delta = isMe ? null : Math.round((pseudoRandom01(rank * 7.3) - 0.5) * 40);
    const name = isMe ? '나' : LEADERBOARD_NAME_POOL[(rank - 1) % LEADERBOARD_NAME_POOL.length];
    entries.push({ rank, name, matchPts, pickPts, totalPts, isMe, delta });
  }
  return entries;
}

// 미참여 주차의 "전체 결과" 탭 — 랭킹 자체는 참여 여부와 무관하게 공개되지만, 내가 없으니 isMe는 항상 false.
function buildLeaderboardNoParticipation() {
  const total = 42;
  const topTotal = 15;
  const entries = [];
  for (let rank = 1; rank <= total; rank++) {
    const t = (rank - 1) / Math.max(1, total - 1);
    const totalPts = Math.round(topTotal - t * topTotal);
    let matchPts = MATCH_POINT_CHOICES[Math.floor(pseudoRandom01(rank) * MATCH_POINT_CHOICES.length)];
    if (matchPts > totalPts) matchPts = totalPts;
    const pickPts = totalPts - matchPts;
    const delta = Math.round((pseudoRandom01(rank * 7.3) - 0.5) * 40);
    const name = LEADERBOARD_NAME_POOL[(rank - 1) % LEADERBOARD_NAME_POOL.length];
    entries.push({ rank, name, matchPts, pickPts, totalPts, isMe: false, delta });
  }
  return entries;
}

// 목록 화면(데스크탑) 우측 "전체 랭킹" — 특정 주차가 아니라 시즌 누적 총점 기준. 컬럼은 총점 하나뿐이라
// 주차별 랭킹(rank-col 3개)보다 단순하다. 데모용 내 순위/총점은 8위·41점으로 고정.
function buildOverallLeaderboard() {
  const total = 156;
  const myRank = 8;
  const myTotal = 41;
  const topTotal = 62;
  const entries = [];
  for (let rank = 1; rank <= total; rank++) {
    const isMe = rank === myRank;
    let totalPts;
    if (isMe) {
      totalPts = myTotal;
    } else if (rank < myRank) {
      const t = (rank - 1) / Math.max(1, myRank - 1);
      totalPts = Math.round(topTotal - t * (topTotal - myTotal));
    } else {
      const t = (rank - myRank) / Math.max(1, total - myRank);
      totalPts = Math.round(myTotal - t * myTotal);
    }
    const delta = isMe ? null : Math.round((pseudoRandom01(rank * 3.7) - 0.5) * 10);
    const name = isMe ? '나' : LEADERBOARD_NAME_POOL[(rank - 1) % LEADERBOARD_NAME_POOL.length];
    entries.push({ rank, name, totalPts, isMe, delta });
  }
  return entries;
}
