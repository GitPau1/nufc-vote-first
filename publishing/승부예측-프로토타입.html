   상태 + 렌더 — view: list | score | pick | confirm | complete | result
   ============================================================ */
// weekGroup = { weekNo, matches: [...] } — 단일 매치위크는 matches가 1개, 더블 매치위크는 2개.
// scores/picks는 매치 id로 키를 나눠서 경기별로 독립적으로 관리한다(더블 매치위크 지원, 2026-08-23).
const state = { view: 'list', weekGroup: null, scores: {}, picks: {}, pickModalTarget: null, countdownTarget: null, resultTab: 'mine', rankExpanded: false };

function updateCountdownDisplay() {
  if (!state.countdownTarget) return;
  const remaining = Math.max(0, state.countdownTarget - Date.now());
  const days = Math.floor(remaining / 86400000);
  const hours = Math.floor((remaining % 86400000) / 3600000);
  const minutes = Math.floor((remaining % 3600000) / 60000);
  const seconds = Math.floor((remaining % 60000) / 1000);
  const pad = n => String(n).padStart(2, '0');
  document.querySelectorAll('.cd-days').forEach(el => { el.textContent = days; });
  document.querySelectorAll('.cd-hours').forEach(el => { el.textContent = pad(hours); });
  document.querySelectorAll('.cd-minutes').forEach(el => { el.textContent = pad(minutes); });
  document.querySelectorAll('.cd-seconds').forEach(el => { el.textContent = pad(seconds); });
}

let countdownInterval = null;
function stopCountdownTicker() {
  if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
}
function startCountdownTicker() {
  stopCountdownTicker();
  updateCountdownDisplay();
  countdownInterval = setInterval(updateCountdownDisplay, 1000);
}

function setState(patch) { Object.assign(state, patch); render(); }

// 주차 카드 상태는 4가지: 미참여(경기 종료 + 예측 안 함) / 참여(예측 제출함 — 경기가 끝났든 아직이든)
// / 진행중(경기 전, 아직 미제출) / 예정(예측 오픈 전). "참여"는 myResult(끝난 경기)뿐 아니라
// myPrediction(아직 안 끝났지만 이미 제출한 경기)도 포함한다 — 이미 제출했으면 안 끝났어도 "진행중"이
// 아니라 "참여"다(사용자 확인, 2026-08-23. 더블 매치위크는 두 경기를 묶어서 한 번에 제출하므로,
// 첫 경기가 먼저 끝나도 둘째 경기가 이미 같이 제출된 상태라면 "참여"로 보여야 앞뒤가 맞는다).
function statusMeta(m) {
  if (m.status === 'open') return myPredictionFor(m) ? { label: '참여', cls: 'badge-positive' } : { label: '진행중', cls: 'badge-default' };
  if (m.status === 'result') return m.myResult ? { label: '참여', cls: 'badge-positive' } : { label: '미참여', cls: 'badge-outline' };
  return { label: '예정', cls: 'badge-outline' };
}

function renderMatchRow(weekNo, m, delay, showMeta) {
  const meta = statusMeta(m);
  const finished = m.status === 'result';
  const myPrediction = myPredictionFor(m);
  const participated = !!myPrediction;
  // 참여했어도 점수(totalPoints)가 아직 없을 수 있다 — 제출은 했지만 결과 발표 전(경기가 안 끝났거나,
  // 끝났어도 점수 계산 전)인 상태.
  const hasScore = participated && typeof myPrediction.totalPoints === 'number';
  // 이미 제출한 경기(진행중이든 끝났든)는 재확인하러 들어갈 수 있어야 하고, 미참여 경기도 결과 화면으로
  // 들어갈 수 있어야 한다 — 예측을 안 했다는 사실 자체가 그 화면의 안내 내용.
  const clickable = m.status === 'open' || finished;

  // 완료된 경기는 결과 스코어 위에, 아직 안 한 경기는 예정 시간 위에 날짜를 작게 붙인다.
  const midHtml = finished
    ? `<span class="mid-date">${m.kickoff}</span><span class="score">${m.actual[0]} – ${m.actual[1]}</span>`
    : `<span class="mid-date">${m.kickoff}</span><span class="kickoff">${m.kickoffTime}</span>`;

  // 우측 요약: 미참여는 생략, 참여는 내 예측(+점수가 나왔으면 같은 텍스트 위계로 점수까지 오른쪽에), 진행중은 예측 링크, 예정은 자물쇠만.
  const actionHtml = participated
    ? hasScore
      ? `<div class="week-row-result"><p class="t-label-2" style="margin:0; font-weight:800;">예측 ${myPrediction.predicted[0]}-${myPrediction.predicted[1]} <span style="color:var(--c-primary-dark);">+${myPrediction.totalPoints}점</span></p></div>`
      : `<div class="week-row-result"><p class="t-label-2" style="margin:0; font-weight:800;">예측 ${myPrediction.predicted[0]}-${myPrediction.predicted[1]}</p></div>`
    : m.status === 'open'
      ? `<span class="week-row-action">예측하기 ›</span>`
      : m.status === 'upcoming'
        ? `<span class="week-row-action locked">🔒</span>`
        : '';

  return `
    <button class="week-row" style="animation-delay:${delay}ms;" ${clickable ? '' : 'disabled'} data-match="${m.id}">
      <div class="week-row-top">
        <span class="week-row-round">${m.competition || '프리미어리그'}</span>
        <span class="week-row-round">${weekNo}라운드</span>
      </div>
      <div class="match-teams">
        <div class="side"><img src="${teamBadge(HOME_TEAM)}" alt="" class="team-logo"><span>${HOME_TEAM}</span></div>
        <div class="mid">${midHtml}</div>
        <div class="side"><img src="${teamBadge(m.opponent)}" alt="" class="team-logo"><span>${m.opponent}</span></div>
      </div>
      ${showMeta ? `
      <div class="week-row-meta">
        <div class="badges">
          <span class="badge ${meta.cls}">${meta.label}</span>
        </div>
        ${actionHtml}
      </div>` : ''}
    </button>`;
}

function findMatchById(matchId) {
  for (const week of WEEKS) {
    const match = week.matches.find(m => m.id === matchId);
    if (match) return { week, match };
  }
  return null;
}

function findWeek(weekNo) {
  return WEEKS.find(w => w.weekNo === weekNo) || null;
}

// 더블 매치위크는 항상 "일정이 빠른 경기가 위, 늦은 경기가 아래"로 보여준다(사용자 확인, 2026-08-23).
// 데이터 입력 순서에 기대지 않고 kickoff(M/D)를 직접 비교해서 정렬한다.
function kickoffSortKey(m) {
  const [month, day] = m.kickoff.split('/').map(Number);
  return month * 100 + day;
}
function sortedMatches(week) {
  return [...week.matches].sort((a, b) => kickoffSortKey(a) - kickoffSortKey(b));
}

// 목록 화면의 "전체 랭킹" — 특정 주차 랭킹과 달리 컬럼이 총점 하나뿐이라 더 단촐하다.
// TOP 3와 내 순위, 두 카드로 분리한다(내가 TOP 3 밖이면 스크롤해서 찾아야 했던 걸 바로 보여주기 위해).
function overallRankRowHtml(entry) {
  const deltaHtml = entry.delta === null
    ? ''
    : entry.delta >= 0
      ? `<span class="rank-delta up">▲${entry.delta}</span>`
      : `<span class="rank-delta down">▼${Math.abs(entry.delta)}</span>`;
  return `
    <div class="rank-row ${entry.isMe ? 'me' : ''}">
      <span class="rank-cell"><span class="rank-number-big">${entry.rank}</span>${deltaHtml}</span>
      <span class="rank-avatar">${SILHOUETTE_SVG}</span>
      <span class="rank-name">${entry.name}</span>
      <span class="rank-col total">${entry.totalPts}점</span>
    </div>`;
}

function overallTop3CardHtml(leaderboard) {
  const top3 = leaderboard.slice(0, 3);
  return `
    <div class="match-card" style="text-align:left;">
      <p class="t-body-2" style="margin:0 0 12px;">전체 랭킹 TOP 3</p>
      <div class="rank-header-row">
        <span class="rank-cell">순위</span>
        <span class="rank-avatar"></span>
        <span class="rank-name"></span>
        <span class="rank-col total">총점</span>
      </div>
      ${top3.map(overallRankRowHtml).join('')}
    </div>`;
}

function overallMyRankCardHtml(leaderboard) {
  const me = leaderboard.find(entry => entry.isMe);
  return `
    <div class="match-card" style="text-align:left;">
      <p class="t-body-2" style="margin:0 0 12px;">내 순위</p>
      ${me ? overallRankRowHtml(me) : `<p class="t-caption-1 muted" style="margin:0;">아직 참여 기록이 없어요</p>`}
    </div>`;
}

// 더블 매치위크(경기 2개) 전용 — 경기 하나씩 클릭하는 대신 주차 카드 전체가 하나의 클릭 영역이다
// (사용자 확인, 2026-08-23). 두 경기 상태가 서로 달라도 각자 배지를 따로 병기한다.
function multiMatchWeekCardHtml(week, delay) {
  const matches = sortedMatches(week);
  // "예측 가능"은 아직 킥오프 전이면서 + 아직 제출 안 한 경기가 있을 때만이다 — 이미 묶어서 제출을
  // 마쳤다면(myPrediction) 경기가 안 끝났어도 더 할 게 없으니 "예측하기"가 아니라 "제출완료"로 보여준다
  // (사용자 확인, 2026-08-23).
  const actionable = matches.some(m => m.status === 'open' && !hasCommittedPrediction(m));
  const anyStillOpen = matches.some(m => m.status === 'open');
  const anyResult = matches.some(m => m.status === 'result');
  const clickable = actionable || anyStillOpen || anyResult;
  const actionHtml = actionable
    ? `<span class="week-row-action">예측하기 ›</span>`
    : anyStillOpen
      ? `<span class="week-row-action">제출완료 ›</span>`
      : anyResult
        ? `<span class="week-row-action">결과보기 ›</span>`
        : `<span class="week-row-action locked">🔒</span>`;

  const miniBlocks = matches.map((m, i) => {
    const meta = statusMeta(m);
    const finished = m.status === 'result';
    const midHtml = finished
      ? `<span class="mid-date">${m.kickoff}</span><span class="score">${m.actual[0]} – ${m.actual[1]}</span>`
      : `<span class="mid-date">${m.kickoff}</span><span class="kickoff">${m.kickoffTime}</span>`;
    return `
      ${i > 0 ? `<div style="height:1px; background:var(--c-gray-4); margin:14px 0;"></div>` : ''}
      <div class="week-row-top">
        <span class="week-row-round">${m.competition || '프리미어리그'}</span>
        <span class="badge ${meta.cls}">${meta.label}</span>
      </div>
      <div class="match-teams">
        <div class="side"><img src="${teamBadge(HOME_TEAM)}" alt="" class="team-logo"><span>${HOME_TEAM}</span></div>
        <div class="mid">${midHtml}</div>
        <div class="side"><img src="${teamBadge(m.opponent)}" alt="" class="team-logo"><span>${m.opponent}</span></div>
      </div>`;
  }).join('');

  return `
    <div class="week-box">
      <button class="week-row" style="animation-delay:${delay}ms;" ${clickable ? '' : 'disabled'} data-week="${week.weekNo}">
        <p class="t-caption-1" style="margin:0 0 12px; font-weight:800; color:var(--c-primary-dark);">더블 매치위크 · 경기 2개</p>
        ${miniBlocks}
        <div class="week-row-meta" style="justify-content:flex-end;">
          ${actionHtml}
        </div>
      </button>
    </div>`;
}

function renderList() {
  let delay = 0;
  // 더블 매치위크(리그+컵처럼 경기가 2개인 주)는 개별 경기 행이 아니라 주차 카드 하나로 묶는다.
  const sections = WEEKS.map(week => {
    const label = `${week.weekNo}주차`;
    // 상태 칩/액션 줄(week-row-meta)은 경기와 경기 사이에 끼어 중복돼 보이니 박스의 마지막 경기에만 보여준다.
    let body;
    if (week.matches.length === 0) {
      body = `<div class="week-box"><div class="week-empty">이번 주는 예정된 경기가 없어요</div></div>`;
    } else if (week.matches.length === 1) {
      body = `<div class="week-box">${renderMatchRow(week.weekNo, week.matches[0], delay, true)}</div>`;
      delay += 55;
    } else {
      body = multiMatchWeekCardHtml(week, delay);
      delay += 55;
    }

    return `<section class="week-section"><p class="week-section-label">${label}</p>${body}</section>`;
  }).join('');

  const monthBarHtml = `
    <div class="month-bar">
      <span class="month-bar-label">8월</span>
      <div class="month-bar-nav">
        <button class="day-strip-arrow" aria-label="이전 달">‹</button>
        <button class="day-strip-arrow" aria-label="다음 달">›</button>
      </div>
    </div>`;

  // 데스크탑은 더 넓게 — 왼쪽 경기 리스트(2) : 오른쪽 전체 랭킹(1)으로 나눈다.
  const overallLeaderboard = buildOverallLeaderboard();

  return `
    <div class="view-mobile">
      <div class="page">
        ${monthBarHtml}
        <div class="week-sections">${sections}</div>
      </div>
    </div>
    <div class="view-desktop">
      <div class="match-screen">
        <div class="list-screen-grid">
          <div>
            ${monthBarHtml}
            <div class="week-sections">${sections}</div>
          </div>
          <div>${overallTop3CardHtml(overallLeaderboard)}<div style="margin-top:16px;">${overallMyRankCardHtml(overallLeaderboard)}</div></div>
        </div>
      </div>
    </div>`;
}

// 스텝 3개(경기예측/선수픽/확인) 공용 메타 — 모바일은 가로, 데스크탑 사이드바는 세로로 그린다.
// 상태는 완료(●채움+체크)/진행중(◎빈원+안쪽 점+primary 테두리)/대기(○빈 원)로만 표현, 텍스트 라벨 없음.
// descMulti: 더블 매치위크(경기 2개 동시 진행)일 때만 쓰는 대체 설명(사용자 확인, 2026-08-23).
const STEP_META = [
  { key: 'score', name: '경기 예측', desc: '이번 경기 스코어를 예측해보세요', descMulti: '이번 두 경기의 스코어를 예측해보세요' },
  { key: 'pick', name: '선수 픽', desc: '포지션별로 이번 경기 활약할 선수를 골라보세요', descMulti: '포지션별로 각 경기에서 활약할 선수를 골라보세요' },
  { key: 'confirm', name: '확인', desc: '제출하기 전, 예측 내용을 확인해보세요' },
];

function stepCircleHtml(state) {
  if (state === 'done') return `<span class="step-circle done">✓</span>`;
  if (state === 'active') return `<span class="step-circle active"><span class="dot"></span></span>`;
  return `<span class="step-circle pending"></span>`;
}

function renderStepIndicator(currentKey, orientation, isMulti = false) {
  const currentIdx = STEP_META.findIndex(s => s.key === currentKey);
  if (orientation === 'v') {
    return `<div class="step-track-v">${STEP_META.map((s, i) => {
      const nodeState = i < currentIdx ? 'done' : i === currentIdx ? 'active' : 'pending';
      const connector = i < STEP_META.length - 1
        ? `<div class="step-connector-v ${i < currentIdx ? 'filled' : ''}"></div>` : '';
      // 설명은 현재 활성화된 단계에만 붙는다 — 완료/대기 노드는 타이틀 한 줄만 유지.
      const desc = isMulti && s.descMulti ? s.descMulti : s.desc;
      const descHtml = nodeState === 'active' ? `<p class="step-node-v-desc">${desc}</p>` : '';
      return `<div class="step-node-v">${stepCircleHtml(nodeState)}<div><span class="name ${nodeState === 'pending' ? 'pending-text' : ''}">${s.name}</span>${descHtml}</div></div>${connector}`;
    }).join('')}</div>`;
  }
  return `<div class="step-track-h">${STEP_META.map((s, i) => {
    const nodeState = i < currentIdx ? 'done' : i === currentIdx ? 'active' : 'pending';
    const connector = i < STEP_META.length - 1
      ? `<div class="step-connector-h ${i < currentIdx ? 'filled' : ''}"></div>` : '';
    return `${stepCircleHtml(nodeState)}${connector}`;
  }).join('')}</div>`;
}

// 모바일 전용 — 스텝 트랙 아래 붙는 현재 단계 타이틀/설명. 데스크탑 사이드바(step-node-v-desc)와
// 같은 텍스트 위계를 쓰되, 여기선 활성 단계 하나만 늘 보여준다 — 타이틀은 활성 상태임을 나타내려 primary 컬러.
function stepHeroHtml(currentKey, isMulti = false) {
  const step = STEP_META.find(s => s.key === currentKey);
  const desc = isMulti && step.descMulti ? step.descMulti : step.desc;
  return `
    <div class="step-hero">
      <p class="t-headline-1" style="margin:0 0 4px; color:var(--c-primary);">${step.name}</p>
      <p class="t-label-2 muted" style="margin:0;">${desc}</p>
    </div>`;
}

function matchMetaHtml(m) {
  return `
    <div class="match-meta">
      <p class="league">${m.competition || '프리미어리그'} · ${m.weekNo}라운드</p>
      <p class="datetime">${m.kickoff} (${m.isHome ? '홈' : '원정'}) ${m.kickoffTime} · 세인트 제임스 파크</p>
    </div>`;
}

// 더블 매치위크 지원 — 스코어는 경기별로 독립된 state.scores[matchId]에 저장한다.
function scoreWidgetHtml(m) {
  const s = state.scores[m.id] || [0, 0];
  return `
    <div class="score-widget">
      <div class="team-label"><img src="${teamBadge(HOME_TEAM)}" alt="" class="team-logo"><span>${HOME_TEAM}</span></div>
      ${scoreStepperCardHtml(s[0], m.id, 0)}
      ${scoreStepperCardHtml(s[1], m.id, 1)}
      <div class="team-label"><img src="${teamBadge(m.opponent)}" alt="" class="team-logo"><span>${m.opponent}</span></div>
    </div>`;
}

function scoreStepperCardHtml(value, matchId, idx) {
  const decDisabled = value <= 0;
  return `
    <div class="score-stepper-card">
      <button data-score-inc="${matchId}:${idx}" aria-label="점수 증가">+</button>
      <div class="value-cell num-bump">${value}</div>
      <button data-score-dec="${matchId}:${idx}" aria-label="점수 감소" ${decDisabled ? 'disabled' : ''}>−</button>
    </div>`;
}

function matchCardHtml(m) {
  return `
    <div class="match-card">
      ${matchMetaHtml(m)}
      <div style="margin-top:20px;">${scoreWidgetHtml(m)}</div>
    </div>`;
}

function renderScoreStep() {
  // weekGroup.matches는 이 주차의 전체 경기(잠긴 경기·이미 제출된 경기 포함)를 들고 있을 수 있다 —
  // 예측 단계는 그중 아직 킥오프 전이면서 아직 제출 안 한(=actionable) 경기만 다룬다
  // (사용자 확인, 2026-08-23: 마감은 경기 단위, 이미 제출한 경기는 다시 예측하지 않음).
  const matches = state.weekGroup.matches.filter(m => m.status === 'open' && !hasCommittedPrediction(m));
  const isMulti = matches.length > 1;
  // 더블 매치위크는 두 match-card를 위(빠른 일정)→아래(늦은 일정) 순으로 쌓고, 각각 "경기 N" 라벨을 붙인다.
  const cardsHtml = matches.map((m, i) => `
    ${isMulti ? `<p class="t-label-2" style="margin:${i === 0 ? '0' : '20px'} 0 8px; font-weight:800; color:var(--c-gray-2);">경기 ${i + 1} · ${HOME_TEAM} vs ${m.opponent}</p>` : ''}
    ${matchCardHtml(m)}`).join('');

  return `
    <div class="view-mobile">
      <div class="match-screen">
        <div style="margin-bottom:28px;">${renderStepIndicator('score', 'h')}${stepHeroHtml('score', isMulti)}</div>
        ${cardsHtml}
        <div class="sticky-bar">
          <button class="btn btn-primary btn-lg btn-full" id="nextBtn">다음</button>
        </div>
      </div>
    </div>
    <div class="view-desktop">
      <div class="match-screen">
        <button class="desktop-back" id="desktopBackBtn">‹ 목록으로</button>
        <div class="match-screen-grid">
          <div>${renderStepIndicator('score', 'v', isMulti)}</div>
          <div>
            ${cardsHtml}
            <div class="sticky-bar" style="margin-top:32px; display:flex; justify-content:center;">
              <button class="btn btn-primary btn-lg" style="width:200px;" id="nextBtnDesktop">다음</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
}

// 재사용 — 경기 예측 화면의 셸(스텝 인디케이터 + 흰 match-card)을 그대로 쓰고,
// 카드 안쪽 콘텐츠만 "포지션 3개 가로 카드"로 교체했다. 실루엣 아이콘은 인라인 SVG(외부 리소스 없음).
const SILHOUETTE_SVG = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="currentColor"/></svg>`;

// 더블 매치위크 지원 — 픽은 경기별로 독립된 state.picks[matchId]에 저장한다.
function positionCardHtml(matchId, position) {
  const picked = state.picks[matchId]?.[position];
  if (!picked) {
    return `
      <button class="position-card" data-open-position="${matchId}:${position}">
        <span class="position-card-label">${POSITION_LABEL[position]}</span>
        <div class="position-card-divider"></div>
        <div class="position-card-empty">
          <span class="silhouette-circle">${SILHOUETTE_SVG}</span>
          <span>선수를<br>선택해요</span>
        </div>
      </button>`;
  }
  return `
    <button class="position-card filled" data-open-position="${matchId}:${position}">
      <span class="position-card-label">${POSITION_LABEL[position]}</span>
      <div class="position-card-divider"></div>
      <div class="position-card-filled">
        <img src="${picked.photo}" alt="" class="player-photo">
        <p class="last-name">${picked.name}</p>
        <span class="rating-num">×${picked.multiplier.toFixed(1)}</span>
      </div>
    </button>`;
}

// 결과 화면 전용 — 같은 position-card 껍데기를 쓰지만 배당 대신 평점 뱃지 + 적중여부 + 획득 점수를 보여준다.
// 결과는 확정된 것이라 버튼이 아니라 div로(클릭 불가).
function positionResultCardHtml(position, player) {
  const pts = demoPoints(player);
  const tier = ratingTier(player.rating);
  return `
    <div class="position-card filled">
      <span class="position-card-label">${POSITION_LABEL[position]}</span>
      <div class="position-card-divider"></div>
      <div class="position-card-filled">
        <img src="${player.photo}" alt="" class="player-photo">
        <p class="last-name">${player.name}</p>
        <span class="badge ${ratingBadgeClass(tier)}">${player.rating.toFixed(1)}</span>
        <div class="result-pick-divider"></div>
        <span class="rating-num">${pts}점</span>
      </div>
    </div>`;
}

// 미참여 주차의 선수 픽 칸 — position-card 껍데기(고정 min-height)는 그대로 써서 참여 주차와 높이가 같다.
function positionEmptyResultCardHtml(position) {
  return `
    <div class="position-card">
      <span class="position-card-label">${POSITION_LABEL[position]}</span>
      <div class="position-card-divider"></div>
      <div class="position-card-empty">
        <span class="silhouette-circle">${SILHOUETTE_SVG}</span>
        <span>선택하지<br>않았어요</span>
      </div>
    </div>`;
}

// 결과 화면 모바일 전용 — 포지션은 행 맨 위 단독 줄, 그 아래 [사진·이름+평점]과 [배당·점수]가
// 한 줄에서 가운데 정렬로 나란히("일자로") 놓인다. 배당은 caption 크기로 작게, 점수는 굵고 크게.
function positionResultRowHtml(position, player) {
  const pts = demoPoints(player);
  const tier = ratingTier(player.rating);
  return `
    <div class="pick-result-row">
      <p class="pick-position">${POSITION_LABEL[position]}</p>
      <div class="pick-result-main">
        <img src="${player.photo}" alt="" class="pick-avatar">
        <div class="pick-info">
          <p class="name">${player.name}</p>
          <span class="badge ${ratingBadgeClass(tier)}">${player.rating.toFixed(1)}</span>
        </div>
        <div class="pick-value">
          <span class="odds">×${player.multiplier.toFixed(1)}</span>
          <span class="points">${pts}점</span>
        </div>
      </div>
    </div>`;
}

function positionEmptyResultRowHtml(position) {
  return `
    <div class="pick-result-row">
      <p class="pick-position">${POSITION_LABEL[position]}</p>
      <div class="pick-result-main">
        <span class="pick-avatar silhouette-circle" style="width:48px; height:48px;">${SILHOUETTE_SVG}</span>
        <div class="pick-info">
          <p class="name muted" style="font-weight:700;">선택하지 않았어요</p>
        </div>
      </div>
    </div>`;
}

// 제출완료 화면 모바일 전용 — 위와 같은 구조지만 경기 전이라 평점·점수가 없다. 배당만 우측에.
function positionCompleteRowHtml(position, player) {
  if (!player) {
    return `
      <div class="pick-result-row">
        <p class="pick-position">${POSITION_LABEL[position]}</p>
        <div class="pick-result-main">
          <span class="pick-avatar silhouette-circle" style="width:48px; height:48px;">${SILHOUETTE_SVG}</span>
          <div class="pick-info">
            <p class="name muted" style="font-weight:700;">선수를 선택해요</p>
          </div>
        </div>
      </div>`;
  }
  return `
    <div class="pick-result-row">
      <p class="pick-position">${POSITION_LABEL[position]}</p>
      <div class="pick-result-main">
        <img src="${player.photo}" alt="" class="pick-avatar">
        <div class="pick-info">
          <p class="name">${player.name}</p>
        </div>
        <div class="pick-value">
          <span class="odds">×${player.multiplier.toFixed(1)}</span>
        </div>
      </div>
    </div>`;
}

function renderPickStep() {
  // 예측 가능한(아직 킥오프 전 + 미제출) 경기만 대상으로 한다 — renderScoreStep과 동일한 이유.
  const matches = state.weekGroup.matches.filter(m => m.status === 'open' && !hasCommittedPrediction(m));
  const isMulti = matches.length > 1;
  const allPicked = matches.every(m => POSITIONS.every(p => state.picks[m.id]?.[p]));

  // 더블 매치위크는 경기별로 포지션 3장씩 따로 고른다(사용자 확인, 2026-08-23). 두 번째 경기부터는
  // 라벨 우측에 기존 edit-link 버튼(수정 링크와 같은 스타일)으로 "그대로 적용"을 붙여 첫 경기 픽을
  // 복사할 수 있게 한다(사용자 확인, 2026-08-23 — 별도 버튼 스타일 만들지 않고 기존 것 재사용).
  const pickBlocksHtml = matches.map((m, i) => {
    const positionRow = `<div class="position-row">${POSITIONS.map(p => positionCardHtml(m.id, p)).join('')}</div>`;
    const labelHtml = isMulti
      ? `<div class="confirm-section-head" style="margin:${i === 0 ? '0' : '20px'} 0 8px;">
          <span class="t-label-2" style="font-weight:800; color:var(--c-gray-2);">경기 ${i + 1} · ${HOME_TEAM} vs ${m.opponent}</span>
          ${i > 0 ? `<button class="edit-link" data-copy-picks-from="${matches[0].id}" data-copy-picks-to="${m.id}">그대로 적용</button>` : ''}
        </div>`
      : '';
    return `${labelHtml}<div class="match-card">${positionRow}</div>`;
  }).join('');

  return `
    <div class="view-mobile">
      <div class="match-screen">
        <div style="margin-bottom:28px;">${renderStepIndicator('pick', 'h')}${stepHeroHtml('pick', isMulti)}</div>
        ${pickBlocksHtml}
        <div class="sticky-bar">
          <button class="btn btn-primary btn-lg btn-full" id="nextBtn" ${allPicked ? '' : 'disabled'}>다음</button>
        </div>
      </div>
    </div>
    <div class="view-desktop">
      <div class="match-screen">
        <button class="desktop-back" id="desktopBackBtn">‹ 목록으로</button>
        <div class="match-screen-grid">
          <div>${renderStepIndicator('pick', 'v', isMulti)}</div>
          <div>
            ${pickBlocksHtml}
            <div class="sticky-bar" style="margin-top:32px; display:flex; justify-content:center;">
              <button class="btn btn-primary btn-lg" style="width:200px;" id="nextBtnDesktop" ${allPicked ? '' : 'disabled'}>다음</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    ${renderPickModal()}`;
}

function renderPickModal() {
  const target = state.pickModalTarget;
  if (!target) return '';
  const { matchId, position } = target;
  const rows = CANDIDATES[position].map(player => {
    const selected = state.picks[matchId]?.[position]?.id === player.id;
    return `
      <button class="player-row ${selected ? 'selected' : ''}" data-pick="${player.id}">
        <span class="who">
          <span class="squad-number">${player.squadNumber}</span>
          <img src="${player.photo}" alt="" class="avatar">
          <span class="name-block">
            <p class="name" style="margin:0;">${player.name}</p>
            <p class="sub" style="margin:0;">${player.nationality} · ${player.age}세</p>
          </span>
        </span>
        <span class="badge badge-default" style="flex-shrink:0;">×${player.multiplier.toFixed(1)}</span>
      </button>`;
  }).join('');

  return `
    <div class="modal-overlay" id="pickModalOverlay">
      <div class="modal-sheet">
        <div class="modal-drag-handle"></div>
        <p class="modal-title">${POSITION_LABEL[position]} 선택</p>
        <div class="player-list">${rows}</div>
      </div>
    </div>`;
}

// 재사용 — 경기 예측/선수 픽 화면과 같은 셸(스텝 인디케이터 + 흰 match-card). "선수 픽" 섹션은
// 선수 픽 화면의 positionCardHtml/position-row를 그대로 재사용해 같은 모습으로 나열한다.
// 더블 매치위크는 경기마다 별도의 match-card를 만들고(사용자 확인 — 한 컨테이너에 합치지 않음),
// 카드 위에 경기 예측/픽 단계와 같은 "경기 N · 상대팀" 라벨을 붙여 식별한다.
function confirmContentHtml(matches) {
  const isMulti = matches.length > 1;
  return matches.map((m, i) => {
    const s = state.scores[m.id] || [0, 0];
    const positionRow = `<div class="position-row">${POSITIONS.map(p => positionCardHtml(m.id, p)).join('')}</div>`;
    const labelHtml = isMulti
      ? `<p class="t-label-2" style="margin:${i === 0 ? '0' : '20px'} 0 8px; font-weight:800; color:var(--c-gray-2);">경기 ${i + 1} · ${HOME_TEAM} vs ${m.opponent}</p>`
      : '';
    return `
      ${labelHtml}
      <div class="match-card">
        <div class="confirm-section-head">
          <span class="t-body-2">경기 예측</span>
          <button class="edit-link" data-goto="score">수정</button>
        </div>
        <div class="matchup-card">
          <div class="team"><img src="${teamBadge(HOME_TEAM)}" alt="" class="team-logo"><span>${HOME_TEAM}</span></div>
          <span class="score">${s[0]} – ${s[1]}</span>
          <div class="team"><img src="${teamBadge(m.opponent)}" alt="" class="team-logo"><span>${m.opponent}</span></div>
        </div>
        <div class="confirm-section-head" style="margin-top:24px;">
          <span class="t-body-2">선수 픽</span>
          <button class="edit-link" data-goto="pick">수정</button>
        </div>
        ${positionRow}
      </div>`;
  }).join('');
}

function renderConfirmStep() {
  // 예측 가능한(아직 킥오프 전 + 미제출) 경기만 확인 대상 — 마감됐거나 이미 제출한 경기는 여기서 수정할 수 없다.
  const matches = state.weekGroup.matches.filter(m => m.status === 'open' && !hasCommittedPrediction(m));
  const content = confirmContentHtml(matches);

  return `
    <div class="view-mobile">
      <div class="match-screen">
        <div style="margin-bottom:28px;">${renderStepIndicator('confirm', 'h')}${stepHeroHtml('confirm')}</div>
        ${content}
        <div class="sticky-bar">
          <button class="btn btn-primary btn-lg btn-full" id="submitBtn">이대로 제출하기</button>
        </div>
      </div>
    </div>
    <div class="view-desktop">
      <div class="match-screen">
        <button class="desktop-back" id="desktopBackBtn">‹ 목록으로</button>
        <div class="match-screen-grid">
          <div>${renderStepIndicator('confirm', 'v')}</div>
          <div>
            ${content}
            <div class="sticky-bar" style="margin-top:32px; display:flex; justify-content:center;">
              <button class="btn btn-primary btn-lg" style="width:200px;" id="submitBtnDesktop">이대로 제출하기</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
}

// divider 대신 간격(높이) 차이로 섹션 계층을 나눈다 — 큰 gap(28px)은 섹션 사이, 작은 gap(10px)은
// 헤드라인과 그 콘텐츠 사이. "결과 반영까지"는 match-card와 별개의 독립 컨테이너(.countdown-block)로
// 카드 위에 배치해 가장 먼저 눈에 들어오게 했다(결과 발표 화면의 .result-hero-box와 같은 패턴).
// 결과 발표까지 남은 시간 — 일/시/분/초 4칸, 1초마다 텍스트만 갱신(재렌더 없이 애니메이션 재생 방지).
function countdownTimerHtml() {
  return `
    <div class="countdown-timer">
      <div class="countdown-seg"><span class="num cd-days">-</span><span class="unit">일</span></div>
      <span class="countdown-colon">:</span>
      <div class="countdown-seg"><span class="num cd-hours">--</span><span class="unit">시간</span></div>
      <span class="countdown-colon">:</span>
      <div class="countdown-seg"><span class="num cd-minutes">--</span><span class="unit">분</span></div>
      <span class="countdown-colon">:</span>
      <div class="countdown-seg"><span class="num cd-seconds">--</span><span class="unit">초</span></div>
    </div>`;
}

// matches에는 이번 주차의 전체 경기(잠긴 경기·이미 제출된 경기 포함)가 들어올 수 있다 — 참여 마감은
// 경기 단위라 더블 매치위크에서 한 경기만 막 제출했어도, 나머지 경기(이미 마감됐거나 이미 제출된)도
// 같은 화면에 함께 보여준다(사용자 확인, 2026-08-23). 경기마다 별도의 match-card로 나누고(한
// 컨테이너에 합치지 않음), 카운트다운과 공유 버튼만 카드 밖에서 공유한다.
// 경기별로 myPredictionFor()가 있으면(방금 제출/이전에 제출/결과까지 나옴 셋 다 포함) 그 내용을,
// 없으면(마감됐고 참여도 안 함) 안내 문구만 보여준다.
function completeCardHtml(matches, shareBtnId, isMobile) {
  const isMulti = matches.length > 1;
  // 카운트다운 문구는 "아직 결과(킥오프)가 안 난 경기"가 여러 개일 때만 늦은 경기 기준임을 밝힌다 —
  // 이미 결과가 확정된 경기는 이미 제출했든 아니든 이 카운트다운과 무관하다.
  const pendingCount = matches.filter(m => m.status === 'open').length;
  const cardHtml = (position, player, matchId) => player
    ? `<button class="position-card filled" data-open-position="${matchId}:${position}">
        <span class="position-card-label">${POSITION_LABEL[position]}</span>
        <div class="position-card-divider"></div>
        <div class="position-card-filled">
          <img src="${player.photo}" alt="" class="player-photo">
          <p class="last-name">${player.name}</p>
          <span class="rating-num">×${player.multiplier.toFixed(1)}</span>
        </div>
      </button>`
    : `<button class="position-card" data-open-position="${matchId}:${position}">
        <span class="position-card-label">${POSITION_LABEL[position]}</span>
        <div class="position-card-divider"></div>
        <div class="position-card-empty">
          <span class="silhouette-circle">${SILHOUETTE_SVG}</span>
          <span>선수를<br>선택해요</span>
        </div>
      </button>`;

  const matchCardsHtml = matches.map((m, i) => {
    const labelHtml = isMulti
      ? `<p class="t-label-2" style="margin:${i === 0 ? '0' : '20px'} 0 8px; font-weight:800; color:var(--c-gray-2);">경기 ${i + 1} · ${HOME_TEAM} vs ${m.opponent}</p>`
      : '';

    const myPrediction = myPredictionFor(m);
    // 마감됐고 참여한 적도 없는 경기 — 예측/픽 내용 없이 안내만.
    if (!myPrediction) {
      return `
        ${labelHtml}
        <div class="match-card" style="text-align:left; animation: rise-in .4s ease both .1s;">
          <p class="t-body-2" style="margin:0 0 10px;">경기 예측</p>
          <div class="predict-compare-box"><p class="t-label-1 muted" style="margin:0;">이 경기는 예측 마감 시간이 지나 참여하지 못했어요</p></div>
        </div>`;
    }

    const predicted = myPrediction.predicted;
    const pickedList = myPrediction.picks || [];
    const positionRow = isMobile
      ? `<div class="pick-result-list">${POSITIONS.map((p, idx) => positionCompleteRowHtml(p, pickedList[idx])).join('')}</div>`
      : `<div class="position-row">${POSITIONS.map((p, idx) => cardHtml(p, pickedList[idx], m.id)).join('')}</div>`;
    return `
      ${labelHtml}
      <div class="match-card" style="text-align:left; animation: rise-in .4s ease both .1s;">
        <p class="t-body-2" style="margin:0 0 10px;">경기 예측</p>
        <div class="matchup-card">
          <div class="team"><img src="${teamBadge(HOME_TEAM)}" alt="" class="team-logo"><span>${HOME_TEAM}</span></div>
          <span class="score">${predicted[0]} – ${predicted[1]}</span>
          <div class="team"><img src="${teamBadge(m.opponent)}" alt="" class="team-logo"><span>${m.opponent}</span></div>
        </div>

        <p class="t-body-2" style="margin:28px 0 10px;">내 선수 픽</p>
        ${positionRow}
      </div>`;
  }).join('');

  return `
    <div class="countdown-block" style="margin-bottom:16px; animation: rise-in .35s ease both;">
      <p class="countdown-caption">결과 반영까지${pendingCount > 1 ? ' (늦은 경기 종료 기준)' : ''}</p>
      ${countdownTimerHtml()}
    </div>
    ${matchCardsHtml}
    <div style="display:flex; justify-content:center; margin-top:28px;">
      <button class="btn btn-primary" style="width:160px;" id="${shareBtnId}">↗ 공유하기</button>
    </div>`;
}

function renderComplete() {
  const { weekNo, matches } = state.weekGroup;
  const introHtml = align => `
    <p class="t-headline-1" style="margin:0 0 4px; text-align:${align}; animation:rise-in .3s ease both;">${weekNo}주차 제출 완료</p>
    <p class="t-label-2 muted" style="margin:0; text-align:${align}; animation:rise-in .35s ease both .08s;">킥오프 전까지 언제든 결과를 확인하러 다시 와주세요</p>`;

  return `
    <div class="view-mobile">
      <div class="match-screen" style="text-align:center;">
        ${introHtml('center')}
        <div style="margin-top:20px;">${completeCardHtml(matches, 'shareBtn', true)}</div>
        <button class="proto-note" id="simulateResultBtn">(프로토타입 전용) 경기 종료 후 결과 화면 미리보기 →</button>
      </div>
    </div>
    <div class="view-desktop">
      <div class="match-screen">
        <button class="desktop-back" id="desktopBackBtn">‹ 목록으로</button>
        <div class="match-screen-grid">
          <div>${introHtml('left')}</div>
          <div>
            ${completeCardHtml(matches, 'shareBtnDesktop', false)}
            <button class="proto-note" id="simulateResultBtnDesktop">(프로토타입 전용) 경기 종료 후 결과 화면 미리보기 →</button>
          </div>
        </div>
      </div>
    </div>`;
}

// 더블 매치위크는 두 경기의 myResult를 하나의 주차 성적으로 합산한다 — 참여한 경기가 하나도
// 없으면 null(=미참여 히어로), 하나라도 참여했으면 matchPoints/totalPoints를 모두 더한다.
// rank/total은 주차 단위 하나만 존재한다고 가정하고 참여한 경기 중 첫 번째 값을 그대로 쓴다(데모용).
function aggregateWeekResult(matches) {
  const participated = matches.filter(m => m.myResult && typeof m.myResult.totalPoints === 'number');
  if (!participated.length) return null;
  const matchPoints = participated.reduce((sum, m) => sum + m.myResult.matchPoints, 0);
  const totalPoints = participated.reduce((sum, m) => sum + m.myResult.totalPoints, 0);
  const { rank, total } = participated[0].myResult;
  return { matchPoints, pickPoints: totalPoints - matchPoints, totalPoints, rank, total };
}

// 옵션 3 — 결과 비교 + 점수/등수를 한 블록으로 통합. "내 예측"(예측 비교+선수픽)와
// "전체 결과"(이 주차 랭킹)를 모바일은 세그먼트 탭으로, 데스크탑은 좌우 컬럼(2:3 비율)으로 나눈다.
// 히어로 — 경기 예측/선수 픽 카드와 별개인 독립 다크 컨테이너(.result-hero-box, #111011).
// 참고 레퍼런스(국가대표 카드) 구조 반영: [작은 라벨 → 굵고 큰 값] 헤더 + 인셋 스탯 박스.
// "N주차 결과"(라벨) → "등수 / 총 인원"(값) → 인셋 박스에 경기예측·선수픽·총점.
// agg는 aggregateWeekResult()의 결과 — 더블 매치위크도 단일 매치위크와 같은 모양이라 그대로 재사용한다.
function resultHeroHtml(weekNo, agg) {
  if (!agg) {
    return `
      <div class="result-hero-box">
        <p class="t-caption-1 muted" style="margin:0;">${weekNo}주차 결과</p>
        <p class="t-label-1" style="margin:10px 0 0; font-weight:800;">이 기간에는 예측에 참여하지 않았어요</p>
      </div>`;
  }
  return `
    <div class="result-hero-box">
      <p class="t-caption-1 muted" style="margin:0;">${weekNo}주차 결과</p>
      <p style="margin:6px 0 0; display:flex; align-items:baseline; justify-content:center; gap:6px;">
        <span style="font-size:28px; font-weight:900;">${agg.rank}위</span>
        <span class="muted t-label-2">/ ${agg.total}명</span>
      </p>
      <div class="result-hero-stats">
        <div>
          <p class="t-caption-1 muted" style="margin:0;">경기예측</p>
          <p class="t-label-1" style="margin:4px 0 0; font-weight:800;">${agg.matchPoints}점</p>
        </div>
        <div>
          <p class="t-caption-1 muted" style="margin:0;">선수픽</p>
          <p class="t-label-1" style="margin:4px 0 0; font-weight:800;">${agg.pickPoints}점</p>
        </div>
        <div>
          <p class="t-caption-1 muted" style="margin:0;">총점</p>
          <p class="t-label-1" style="margin:4px 0 0; font-weight:800;"><span class="total-points-value">0</span>점</p>
        </div>
      </div>
    </div>`;
}

// 경기 예측 섹션 구조 — 칩 → 구단명/["내 예측" 라벨+스코어를 세로로]/구단명 한 행(matchup-card) → "실제 결과" 라벨 → 스코어.
// "내 예측" 라벨은 행 전체 위가 아니라 스코어 바로 위에 오도록 스코어와 한 컬럼으로 묶는다.
// 실제 결과는 라벨과 스코어를 세로로 배열하되 구단명은 넣지 않는다.
// 미참여 경기는 r이 없다 — "내 예측" 칼럼 자리만 안내 문구로 바꾸고, 팀 로고 두 칸은 그대로 둬서
// matchup-card 높이가 참여 경기와 항상 같게 유지된다.
// isMobile=true면 "내 선수 픽"을 가로 카드 3장 대신 세로 목록(점수는 오른쪽)으로 그린다 — 375px에서
// 카드 3장이 너무 좁아지는 걸 막기 위함. 데스크탑은 폭이 넉넉해 기존 가로 카드를 그대로 쓴다.
// 더블 매치위크는 경기마다 별도의 match-card로 나눈다(사용자 확인 — 한 컨테이너에 합치지 않음).
// 카드 바깥에 붙는 "경기 N · 상대팀" 라벨은 예측/픽 단계와 같은 자리·모양을 재사용하고,
// 카드 안쪽 헤더("경기 예측"/"내 선수 픽")는 단일 매치위크와 동일하게 유지한다.
function resultMatchBlockHtml(m, isMobile) {
  // 더블 매치위크에서 한 경기는 이미 끝났지만 다른 경기가 아직 시작 전인 경우(사용자 확인, 2026-08-23:
  // 목록 카드에는 두 상태를 각각 병기) — 결과 화면에서도 안내만 하고 예측/픽 내용은 노출하지 않는다.
  if (m.status !== 'result') {
    return `
      <p class="t-body-2" style="margin:0 0 10px;">경기 예측</p>
      <div class="predict-compare-box"><p class="t-label-1 muted" style="margin:0;">${m.kickoff} ${m.kickoffTime} 예정 · 아직 시작하지 않은 경기예요</p></div>`;
  }

  const r = m.myResult;
  const participated = !!r;
  const byPos = participated ? Object.fromEntries(r.picks.map(p => [p.position, p])) : {};
  const positionRow = isMobile
    ? `<div class="pick-result-list">${POSITIONS.map(p =>
        participated ? positionResultRowHtml(p, byPos[p]) : positionEmptyResultRowHtml(p)
      ).join('')}</div>`
    : `<div class="position-row">${POSITIONS.map(p =>
        participated ? positionResultCardHtml(p, byPos[p]) : positionEmptyResultCardHtml(p)
      ).join('')}</div>`;
  const chipClass = participated ? (r.matchPoints > 0 ? 'badge-positive' : 'badge-negative') : 'badge-outline';
  const chipLabel = participated ? (r.matchPoints > 0 ? `+${r.matchPoints}점` : '0점') : '미참여';
  // 가운데 칸 텍스트는 좌우 팀 컬럼 사이에서 짜부라지기 쉬우니 min-width:0 + nowrap으로 방어하고,
  // 스코어 폰트도 히어로용 .score(28px) 대신 한 단계 작은 t-heading-1로 낮춰 375px에서도 한 줄에 들어가게 한다.
  const middleColumnHtml = participated
    ? `<div style="display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0;">
        <span class="t-caption-1 muted" style="white-space:nowrap;">내 예측</span>
        <span class="t-heading-1" style="white-space:nowrap;">${r.predicted[0]} – ${r.predicted[1]}</span>
      </div>`
    : `<div style="display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0;">
        <span class="t-caption-1 muted" style="white-space:nowrap;">내 예측</span>
        <span class="t-label-1" style="font-weight:800; white-space:nowrap;">미참여</span>
      </div>`;

  return `
    <p class="t-body-2" style="margin:0 0 10px;">경기 예측</p>
    <div class="predict-compare-box">
      <span class="badge ${chipClass}">${chipLabel}</span>
      <div class="matchup-card" style="margin:0;">
        <div class="team"><img src="${teamBadge(HOME_TEAM)}" alt="" class="team-logo"><span>${HOME_TEAM}</span></div>
        ${middleColumnHtml}
        <div class="team"><img src="${teamBadge(m.opponent)}" alt="" class="team-logo"><span>${m.opponent}</span></div>
      </div>
      <div class="actual-result-box">
        <p class="t-caption-1 muted" style="margin:0 0 2px;">실제 결과</p>
        <p class="t-label-1" style="margin:0; font-weight:800;">${m.actual[0]} – ${m.actual[1]}</p>
      </div>
    </div>

    <p class="t-body-2" style="margin:28px 0 10px;">내 선수 픽</p>
    ${positionRow}`;
}

function resultMineCardHtml(matches, shareBtnId, isMobile) {
  const isMulti = matches.length > 1;
  const anyParticipated = matches.some(m => m.myResult && typeof m.myResult.totalPoints === 'number');
  const cardsHtml = matches.map((m, i) => {
    const labelHtml = isMulti
      ? `<p class="t-label-2" style="margin:${i === 0 ? '0' : '20px'} 0 8px; font-weight:800; color:var(--c-gray-2);">경기 ${i + 1} · ${HOME_TEAM} vs ${m.opponent}</p>`
      : '';
    return `
      ${labelHtml}
      <div class="match-card" style="text-align:left; animation: rise-in .4s ease both .1s;">
        ${resultMatchBlockHtml(m, isMobile)}
      </div>`;
  }).join('');

  return `
    ${cardsHtml}
    ${anyParticipated ? `<div style="display:flex; justify-content:center; margin-top:28px;"><button class="btn btn-primary" style="width:160px;" id="${shareBtnId}">↗ 공유하기</button></div>` : ''}
  `;
}

// 레퍼런스(주간 스코어 리더보드) 구조 참고 — 큰 순위 숫자 + 원형 아바타(실루엣) + 이름 + 강조된 점수 셀.
// 순위 변동(▲/▼) 표시는 지난주 순위 데이터가 없어 이번엔 제외했다.
// 데스크탑(capped=true)은 10명까지만 자르고 "전체보기"로 펼친다 — 내 순위가 10위 밖이면 "⋯" 구분 후
// 내 행을 별도로 붙여 항상 보이게 한다. 모바일(capped=false)은 전체 로우를 다 그린 뒤 CSS
// max-height(vh 단위)로 기기 화면 높이에 맞춰 자연스럽게 잘라 보여주고, 마찬가지로 "전체보기"로 펼친다.
const WEEK_RANK_CAP = 10;
function resultRankCardHtml(leaderboard, opts = {}) {
  const { capped = false, toggleId = 'rankViewAllBtn', weekNo } = opts;
  const expanded = state.rankExpanded;
  const row = entry => {
    const deltaHtml = entry.delta === null
      ? ''
      : entry.delta >= 0
        ? `<span class="rank-delta up">▲${entry.delta}</span>`
        : `<span class="rank-delta down">▼${Math.abs(entry.delta)}</span>`;
    return `
      <div class="rank-row ${entry.isMe ? 'me' : ''}">
        <span class="rank-cell"><span class="rank-number-big">${entry.rank}</span>${deltaHtml}</span>
        <span class="rank-avatar">${SILHOUETTE_SVG}</span>
        <span class="rank-name">${entry.name}</span>
        <span class="rank-col">${entry.matchPts}</span>
        <span class="rank-col">${entry.pickPts}</span>
        <span class="rank-col total">${entry.totalPts}</span>
      </div>`;
  };

  const overLimit = leaderboard.length > WEEK_RANK_CAP;
  let bodyHtml;
  if (capped && !expanded && overLimit) {
    const visible = leaderboard.slice(0, WEEK_RANK_CAP);
    const me = leaderboard.find(e => e.isMe);
    const meHidden = me && !visible.some(e => e.isMe);
    bodyHtml = visible.map(row).join('') + (meHidden ? `<div class="rank-row-truncated">⋯</div>${row(me)}` : '');
  } else {
    bodyHtml = leaderboard.map(row).join('');
  }
  const showToggle = !expanded && overLimit;
  const listClass = !capped && !expanded ? 'week-rank-list mobile-capped' : 'week-rank-list';

  return `
    <div class="match-card" style="text-align:left; animation: rise-in .4s ease both .15s;">
      <p class="t-body-2" style="margin:0 0 12px;">${weekNo}주차 랭킹</p>
      <div class="${listClass}">
        <div class="rank-header-row">
          <span class="rank-cell">순위</span>
          <span class="rank-avatar"></span>
          <span class="rank-name"></span>
          <span class="rank-col">예측</span>
          <span class="rank-col">선수픽</span>
          <span class="rank-col total">종합</span>
        </div>
        ${bodyHtml}
      </div>
      ${showToggle ? `<button class="rank-view-all-btn" id="${toggleId}">전체보기 · ${leaderboard.length}명</button>` : ''}
    </div>`;
}

function renderResult() {
  const { weekNo, matches } = state.weekGroup;
  const agg = aggregateWeekResult(matches);
  const leaderboard = agg ? buildLeaderboard(agg) : buildLeaderboardNoParticipation();

  return `
    <div class="view-mobile">
      <div class="match-screen">
        ${resultHeroHtml(weekNo, agg)}
        <div class="segment-bar">
          <button class="segment ${state.resultTab === 'mine' ? 'active' : ''}" data-result-tab="mine">내 예측</button>
          <button class="segment ${state.resultTab === 'rank' ? 'active' : ''}" data-result-tab="rank">전체 결과</button>
        </div>
        ${state.resultTab === 'rank'
          ? resultRankCardHtml(leaderboard, { capped: false, toggleId: 'rankViewAllBtn', weekNo })
          : resultMineCardHtml(matches, 'shareBtn', true)}
      </div>
    </div>
    <div class="view-desktop">
      <div class="match-screen">
        <button class="desktop-back" id="desktopBackBtn">‹ 목록으로</button>
        <div style="max-width:709px; margin:0 auto;">
          ${resultHeroHtml(weekNo, agg)}
          ${resultMineCardHtml(matches, 'shareBtnDesktop', false)}
          <div style="margin-top:24px;">${resultRankCardHtml(leaderboard, { capped: true, toggleId: 'rankViewAllBtnDesktop', weekNo })}</div>
        </div>
      </div>
    </div>`;
}

/* ============================================================
   렌더 디스패치 + 이벤트 바인딩
   ============================================================ */
function render() {
  const root = document.getElementById('root');
  const backBtn = document.getElementById('backBtn');
  const mobileLogo = document.getElementById('mobileLogo');

  const isList = state.view === 'list';
  backBtn.style.display = isList ? 'none' : 'flex';
  mobileLogo.style.display = isList ? 'block' : 'none';

  if (state.view === 'list') root.innerHTML = renderList();
  else if (state.view === 'score') root.innerHTML = renderScoreStep();
  else if (state.view === 'pick') root.innerHTML = renderPickStep();
  else if (state.view === 'confirm') root.innerHTML = renderConfirmStep();
  else if (state.view === 'complete') root.innerHTML = renderComplete();
  else if (state.view === 'result') root.innerHTML = renderResult();

  bindEvents();

  stopCountdownTicker();
  if (state.view === 'complete') startCountdownTicker();

  if (state.view === 'result') {
    const agg = aggregateWeekResult(state.weekGroup.matches);
    if (agg) animateCountUp('total-points-value', agg.totalPoints);
  }
}

function bindEvents() {
  document.getElementById('backBtn').onclick = () => setState({ view: 'list' });

  if (state.view === 'list') {
    // 단일 경기 주차 — 경기 행 하나하나가 그대로 클릭 단위(기존과 동일). 이미 제출했지만 아직
    // 경기 전인 경우(myPrediction)도 새로 예측하는 게 아니라 제출완료 화면으로 보낸다(사용자 확인, 2026-08-23).
    document.querySelectorAll('[data-match]').forEach(el => {
      el.onclick = () => {
        const found = findMatchById(el.dataset.match);
        if (!found) return;
        const match = { ...found.match, weekNo: found.week.weekNo };
        if (match.status === 'open' && !match.myPrediction) {
          setState({
            view: 'score',
            weekGroup: { weekNo: match.weekNo, matches: [match] },
            scores: { [match.id]: [0, 0] },
            picks: { [match.id]: {} },
          });
        } else if (match.status === 'open' && match.myPrediction) {
          setState({ view: 'complete', weekGroup: { weekNo: match.weekNo, matches: [match] }, countdownTarget: Date.now() + (2 * 86400 + 10 * 3600 + 57 * 60 + 32) * 1000 });
        } else if (match.status === 'result') {
          if (match.myResult && typeof match.myResult.totalPoints !== 'number') {
            // 제출은 했지만 아직 결과(점수) 발표 전 — 결과 발표 카운트다운 화면으로.
            setState({ view: 'complete', weekGroup: { weekNo: match.weekNo, matches: [match] }, countdownTarget: Date.now() + (14 * 3600 + 22 * 60) * 1000 });
          } else {
            // 참여(점수 있음) + 미참여 둘 다 결과 화면으로 — 미참여는 화면 안에서 안내한다.
            setState({ view: 'result', weekGroup: { weekNo: match.weekNo, matches: [match] }, resultTab: 'mine', rankExpanded: false });
          }
        }
      };
    });

    // 더블 매치위크 — 주차 카드 전체가 클릭 단위(사용자 확인, 2026-08-23). 참여 마감은 "주차"가
    // 아니라 "경기" 단위지만, 두 경기가 같이 열려있는 동안은 묶어서 한 번에 제출하는 구조라서
    // "예측할 게 남아있는지"(actionable = 아직 열려있고 미제출)로 분기한다(사용자 확인, 2026-08-23):
    //  - actionable이 있으면 → 'score'(예측할 경기만). 예측/픽/확인 단계는 render 함수에서 이 조건으로
    //    한 번 더 걸러 쓴다.
    //  - actionable은 없지만 아직 안 끝난 경기가 있으면(둘 다 이미 제출 완료, 결과 대기) → 'complete'.
    //  - 전부 끝났으면 → 'result'.
    // weekGroup에는 항상 이 주차의 전체 경기를 담아, 마감된/이미 제출된 경기도 같은 맥락에서 함께 보여준다.
    document.querySelectorAll('[data-week]').forEach(el => {
      el.onclick = () => {
        const week = findWeek(+el.dataset.week);
        if (!week) return;
        const matches = sortedMatches(week).map(m => ({ ...m, weekNo: week.weekNo }));
        const actionableMatches = matches.filter(m => m.status === 'open' && !hasCommittedPrediction(m));
        if (actionableMatches.length > 0) {
          setState({
            view: 'score',
            weekGroup: { weekNo: week.weekNo, matches },
            scores: Object.fromEntries(actionableMatches.map(m => [m.id, [0, 0]])),
            picks: Object.fromEntries(actionableMatches.map(m => [m.id, {}])),
          });
        } else if (matches.some(m => m.status === 'open')) {
          setState({ view: 'complete', weekGroup: { weekNo: week.weekNo, matches }, countdownTarget: Date.now() + (2 * 86400 + 10 * 3600 + 57 * 60 + 32) * 1000 });
        } else if (matches.some(m => m.status === 'result')) {
          setState({ view: 'result', weekGroup: { weekNo: week.weekNo, matches }, resultTab: 'mine', rankExpanded: false });
        }
      };
    });
  }

  if (state.view === 'score') {
    document.querySelectorAll('[data-score-dec]').forEach(el => {
      el.onclick = () => {
        const [matchId, idxStr] = el.dataset.scoreDec.split(':');
        const idx = +idxStr;
        const s = [...(state.scores[matchId] || [0, 0])];
        s[idx] = Math.max(0, s[idx] - 1);
        setState({ scores: { ...state.scores, [matchId]: s } });
      };
    });
    document.querySelectorAll('[data-score-inc]').forEach(el => {
      el.onclick = () => {
        const [matchId, idxStr] = el.dataset.scoreInc.split(':');
        const idx = +idxStr;
        const s = [...(state.scores[matchId] || [0, 0])];
        s[idx] = s[idx] + 1;
        setState({ scores: { ...state.scores, [matchId]: s } });
      };
    });
    ['nextBtn', 'nextBtnDesktop'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onclick = () => setState({ view: 'pick' });
    });
    const desktopBack = document.getElementById('desktopBackBtn');
    if (desktopBack) desktopBack.onclick = () => setState({ view: 'list' });
  }

  if (state.view === 'pick') {
    document.querySelectorAll('[data-open-position]').forEach(el => {
      el.onclick = () => {
        const [matchId, position] = el.dataset.openPosition.split(':');
        setState({ pickModalTarget: { matchId, position } });
      };
    });
    document.querySelectorAll('[data-pick]').forEach(el => {
      el.onclick = () => {
        const { matchId, position } = state.pickModalTarget;
        const player = CANDIDATES[position].find(p => p.id === el.dataset.pick);
        setState({
          picks: { ...state.picks, [matchId]: { ...(state.picks[matchId] || {}), [position]: player } },
          pickModalTarget: null,
        });
      };
    });
    // "N전 픽 그대로 적용" — 첫 경기에서 고른 픽을 다른 경기에 그대로 복사한다(사용자 확인, 2026-08-23).
    document.querySelectorAll('[data-copy-picks-from]').forEach(el => {
      el.onclick = () => {
        const from = el.dataset.copyPicksFrom;
        const to = el.dataset.copyPicksTo;
        setState({ picks: { ...state.picks, [to]: { ...(state.picks[from] || {}) } } });
      };
    });
    const overlay = document.getElementById('pickModalOverlay');
    if (overlay) {
      overlay.onclick = e => { if (e.target === overlay) setState({ pickModalTarget: null }); };
    }
    ['nextBtn', 'nextBtnDesktop'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onclick = () => setState({ view: 'confirm' });
    });
    const desktopBack = document.getElementById('desktopBackBtn');
    if (desktopBack) desktopBack.onclick = () => setState({ view: 'list' });
  }

  if (state.view === 'confirm') {
    document.querySelectorAll('[data-goto]').forEach(el => {
      el.onclick = () => setState({ view: el.dataset.goto });
    });
    // 확인 화면의 선수 픽 카드도 눌러서 바로 픽 화면으로 돌아가 수정할 수 있게(= "수정" 링크와 동일 동작)
    document.querySelectorAll('[data-open-position]').forEach(el => {
      el.onclick = () => setState({ view: 'pick' });
    });
    ['submitBtn', 'submitBtnDesktop'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onclick = () => {
        // 방금 제출한 예측을 실제 데이터(WEEKS)에도 남긴다 — 안 그러면 목록으로 돌아갔다가 같은
        // 경기를 다시 눌렀을 때 "아직 아무것도 안 한 경기"로 보여서 또 예측하게 되는 버그가 난다
        // (사용자 확인, 2026-08-23 — "참여"는 제출한 상태를 뜻하므로 제출 즉시 반영돼야 한다).
        state.weekGroup.matches
          .filter(m => m.status === 'open' && !hasCommittedPrediction(m) && state.scores[m.id])
          .forEach(m => {
            const found = findMatchById(m.id);
            if (found) found.match.myPrediction = { predicted: state.scores[m.id], picks: POSITIONS.map(p => state.picks[m.id]?.[p]) };
          });
        // 데모용 임의 목표 시각 — 결과 발표(=경기 종료) 시점까지 2일 10시간 57분 32초 남은 상태로 시작.
        // 더블 매치위크도 이 값 하나만 쓴다 — 실제 구현에서는 더 늦게 끝나는 경기 기준으로 계산해야 한다.
        setState({ view: 'complete', countdownTarget: Date.now() + (2 * 86400 + 10 * 3600 + 57 * 60 + 32) * 1000 });
      };
    });
    const desktopBack = document.getElementById('desktopBackBtn');
    if (desktopBack) desktopBack.onclick = () => setState({ view: 'list' });
  }

  if (state.view === 'complete') {
    // 더블 매치위크는 이번 세션에서 방금 예측한(status:'open') 경기만 시뮬레이션한다 — 이미 마감됐거나
    // 결과가 나온 다른 경기(사용자 확인, 2026-08-23: 참여 마감은 경기 단위)는 그대로 둔다.
    const DEMO_ACTUALS = [[2, 0], [1, 1]];
    function simulateResult() {
      const matches = state.weekGroup.matches.map((m, i) => {
        if (m.status !== 'open') return m;
        const actual = m.actual || DEMO_ACTUALS[i % DEMO_ACTUALS.length];
        const predicted = state.scores[m.id] || [0, 0];
        const mp = matchPoints(predicted, actual);
        const picksArr = POSITIONS.map(p => state.picks[m.id]?.[p]);
        const total = mp + picksArr.reduce((sum, p) => sum + (p ? demoPoints(p) : 0), 0);
        return {
          ...m, status: 'result', actual,
          myResult: { predicted, actual, matchPoints: mp, totalPoints: total, rank: 8, total: 42, picks: picksArr },
        };
      });
      setState({ view: 'result', weekGroup: { ...state.weekGroup, matches }, resultTab: 'mine', rankExpanded: false });
    }
    const desktopBack = document.getElementById('desktopBackBtn');
    if (desktopBack) desktopBack.onclick = () => setState({ view: 'list' });
    ['shareBtn', 'shareBtnDesktop'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onclick = () => shareNotice(el);
    });
    ['simulateResultBtn', 'simulateResultBtnDesktop'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onclick = simulateResult;
    });
  }

  if (state.view === 'result') {
    document.querySelectorAll('[data-result-tab]').forEach(el => {
      el.onclick = () => setState({ resultTab: el.dataset.resultTab, rankExpanded: false });
    });
    ['shareBtn', 'shareBtnDesktop'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onclick = () => shareNotice(el);
    });
    ['rankViewAllBtn', 'rankViewAllBtnDesktop'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onclick = () => setState({ rankExpanded: true });
    });
    const desktopBack = document.getElementById('desktopBackBtn');
    if (desktopBack) desktopBack.onclick = () => setState({ view: 'list' });
  }
}

// class 기준으로 갱신 — 모바일/데스크탑 블록에 동일 id가 중복 렌더되는 화면이 있어서
// getElementById(첫 번째 것만 찾음) 대신 querySelectorAll로 양쪽 다 갱신한다.
function animateCountUp(className, target) {
  const els = document.querySelectorAll('.' + className);
  if (!els.length) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    els.forEach(el => { el.textContent = target; });
    return;
  }
  const duration = 650;
  const start = performance.now();
  function tick(now) {
    const progress = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - progress, 3);
    const value = Math.round(target * eased);
    els.forEach(el => { el.textContent = value; });
    if (progress < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function shareNotice(btn) {
  const original = btn.textContent;
  btn.textContent = '준비 중이에요';
  btn.disabled = true;
  setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1200);
}

render();
</script>
